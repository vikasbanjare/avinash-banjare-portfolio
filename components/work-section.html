<html lang="en">
<head>

<!-- ===== SECTION STYLES (paste) — the one scoped block; every selector under [data-vbwork2], every class vw2- ===== -->
<style>
[data-vbwork2]{position:relative;z-index:2;box-sizing:border-box;background:#04060d;overflow:clip;padding:clamp(90px,13vh,160px) clamp(20px,5vw,90px) clamp(80px,10vh,130px);font-family:'Onest',system-ui,sans-serif;color:#eaf0ff}
[data-vbwork2] *,[data-vbwork2] *::before,[data-vbwork2] *::after{box-sizing:border-box}
[data-vbwork2] button{margin:0;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
[data-vbwork2] button:focus-visible{outline:2px solid #b6f500;outline-offset:3px}
[data-vbwork2] img{display:block}
[data-vbwork2] .vw2-wrap{max-width:1400px;margin:0 auto}
[data-vbwork2] .vw2-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header (site-wide pattern) ---------- */
[data-vbwork2] .vw2-head{margin-bottom:0} /* the filter row's hairline is the list's top rule */
[data-vbwork2] .vw2-head-top{display:grid;gap:16px;margin-bottom:8px}
[data-vbwork2] .vw2-eyebrow{display:block;margin-bottom:18px;font-size:11.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#b6f500}
[data-vbwork2] .vw2-h2{margin:0;font-family:'Space Grotesk',sans-serif;font-size:clamp(30px,3.7vw,54px);font-weight:600;line-height:1.05;letter-spacing:-.035em;color:#f6f9ff}
[data-vbwork2] .vw2-accent{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-.01em;color:#b6f500}
[data-vbwork2] .vw2-sub{margin:0 0 16px;max-width:380px;font-size:15px;line-height:1.6;color:#8da0c4}
[data-vbwork2] .vw2-sub-d{display:none} /* the approved sentence talks about the monitor: only shown where the monitor exists */
[data-vbwork2] .vw2-stats{display:flex;flex-wrap:wrap;gap:6px 0;margin:0}
[data-vbwork2] .vw2-stats div{display:flex;align-items:baseline;gap:8px}
[data-vbwork2] .vw2-stats div + div::before{content:"\00b7";order:-2;margin:0 6px;color:#8da0c4}
[data-vbwork2] .vw2-stats dd{order:-1;margin:0;font:400 27px/1 'Instrument Serif',serif;font-style:italic;color:#f6f9ff}
[data-vbwork2] .vw2-stats dt{font-size:13px;color:#8da0c4}
/* filters: a line of small-caps words, not chips. The active word carries a 1px lime underline. */
[data-vbwork2] .vw2-bar{border-bottom:1px solid rgba(255,255,255,.1)}
[data-vbwork2] .vw2-filters{display:flex;flex-wrap:wrap;align-items:baseline}
[data-vbwork2] .vw2-filt{display:inline-flex;align-items:baseline;padding:14px 0;font-size:12.5px;font-weight:600;line-height:1.3;letter-spacing:.14em;text-transform:uppercase;color:#8da0c4} /* 16 + 28 = 44px tall */
[data-vbwork2] .vw2-filt + .vw2-filt::before{content:"\00b7";margin:0 22px;color:#8da0c4}
[data-vbwork2] .vw2-fl{display:inline-block;padding-bottom:5px;border-bottom:1px solid transparent}
[data-vbwork2] .vw2-filt b{margin-left:5px;font:400 16px/1 'Instrument Serif',serif;font-style:italic;letter-spacing:0;color:inherit}
[data-vbwork2] .vw2-filt[aria-pressed="true"]{color:#f6f9ff}
[data-vbwork2] .vw2-filt[aria-pressed="true"] .vw2-fl{border-color:#b6f500}

/* ---------- list: base = compact media rows (phone / tablet / short viewports) ---------- */
[data-vbwork2] .vw2-list{list-style:none;margin:0;padding:0;transition:opacity .12s linear}
[data-vbwork2] .vw2-list.vw2-out{opacity:0}
/* li = mask + dim target, button = the thing that slides: entrance and dim never fight over one opacity */
[data-vbwork2] .vw2-item{display:block;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.1);transition:opacity .35s ease}
[data-vbwork2] .vw2-item[hidden]{display:none}
[data-vbwork2] .vw2-row{position:relative;display:block;width:100%}
[data-vbwork2] .vw2-row:focus-visible{outline-offset:-3px}
[data-vbwork2] .vw2-grid{display:grid;grid-template-columns:96px minmax(0,1fr);column-gap:16px;row-gap:2px;align-items:start;min-height:88px;padding:16px 0}
[data-vbwork2] .vw2-num{display:block;grid-column:2;grid-row:1;font:400 15px/1 'Instrument Serif',serif;font-style:italic;color:#8da0c4}
[data-vbwork2] .vw2-thumb{position:relative;display:block;grid-column:1;grid-row:1 / span 2;width:96px;height:68px;border-radius:3px;overflow:hidden;background:#080d1a}
[data-vbwork2] .vw2-thumb img,[data-vbwork2] .vw2-strip img{width:100%;height:100%;object-fit:cover}
[data-vbwork2] .vw2-txt{display:block;grid-column:2;grid-row:2;min-width:0}
[data-vbwork2] .vw2-title{display:block;font-family:'Space Grotesk',sans-serif;font-size:clamp(20px,2vw,30px);font-weight:600;line-height:1.1;letter-spacing:-.025em;color:#f6f9ff;overflow-wrap:break-word;transition:opacity .15s ease}
[data-vbwork2] .vw2-meta{display:block;margin-top:6px;font-size:14px;font-weight:400;line-height:1.4;color:#8da0c4}
[data-vbwork2] .vw2-strip{display:none}
[data-vbwork2] .vw2-strip i{display:block;width:84px;height:52px;border-radius:3px;overflow:hidden;background:#080d1a}
/* one arrow, not thirteen: hidden until hover / press / the row on the frame; slides flush from 6px in (never past the li's clip edge) */
[data-vbwork2] .vw2-arrow{display:none;align-items:center;justify-content:flex-end;width:30px;height:44px;color:#f6f9ff;opacity:0;transform:translateX(-6px);transition:opacity .3s ease,transform .5s cubic-bezier(.2,.7,.3,1)}
[data-vbwork2] .vw2-arrow svg{width:18px;height:18px}
/* pressed feedback (tap highlight is off, so a phone tap needs its own) */
[data-vbwork2] .vw2-row:active .vw2-arrow{opacity:1;transform:translateX(0);transition-duration:.15s}
[data-vbwork2] .vw2-row:active .vw2-title{opacity:.7}
[data-vbwork2] .vw2-row.vw2-fin{animation:vw2-fin .12s ease backwards}
@keyframes vw2-fin{from{opacity:0;transform:translateY(8px)}}
[data-vbwork2] .vw2-mon{display:none}

@media (hover:hover){
  [data-vbwork2] .vw2-filt:hover{color:#f6f9ff}
  [data-vbwork2] .vw2-row:hover .vw2-arrow{opacity:1;transform:translateX(0)}
  [data-vbwork2] .vw2-open:hover .vw2-open-t{text-decoration-color:#b6f500}
  [data-vbwork2] .vw2-open:hover svg{transform:translateX(4px)}
}

@media (min-width:520px){
  [data-vbwork2] .vw2-head-top{gap:24px;margin-bottom:clamp(14px,2vw,28px)}
  [data-vbwork2] .vw2-grid{grid-template-columns:48px 96px minmax(0,1fr) 30px;column-gap:18px;row-gap:0;align-items:center;padding:18px 0}
  [data-vbwork2] .vw2-num{grid-column:1;grid-row:1 / span 2;font-size:20px}
  [data-vbwork2] .vw2-thumb{grid-column:2;grid-row:1 / span 2}
  [data-vbwork2] .vw2-txt{grid-column:3;grid-row:1 / span 2}
  [data-vbwork2] .vw2-arrow{display:flex;grid-column:4;grid-row:1 / span 2}
}
/* tablet / short-desktop: three real frames in their own column, so the row's middle is never empty */
@media (min-width:768px){
  [data-vbwork2] .vw2-grid{grid-template-columns:48px 96px minmax(0,1fr) auto 30px}
  [data-vbwork2] .vw2-strip{display:flex;gap:6px;grid-column:4;grid-row:1 / span 2}
  [data-vbwork2] .vw2-strip:empty{display:none}
  [data-vbwork2] .vw2-arrow{grid-column:5}
}
@media (min-width:900px){
  /* anchored, not floating: the block's right edge is the content (and monitor) edge, its left edge is a drawn rule */
  [data-vbwork2] .vw2-head-top{grid-template-columns:minmax(0,1fr) 380px;align-items:end;column-gap:clamp(28px,4vw,64px)}
  [data-vbwork2] .vw2-head-r{padding-left:24px;border-left:1px solid rgba(255,255,255,.14)}
  [data-vbwork2] .vw2-sub{max-width:none}
}

/* ---------- monitor (only ever displayed inside the desktop query below): one frame on the page, a caption under it ---------- */
[data-vbwork2] .vw2-mon-in{position:relative}
/* max-height keeps frame + caption inside the viewport (the still is cover-fit, so a shorter box is a tighter crop, never bands).
   Budget: caption under the frame is <= 180px (2-line title), sticky top <= 121px whenever this clamp is the limit. */
[data-vbwork2] .vw2-viewer{position:relative;display:block;width:100%;aspect-ratio:16/9;min-height:190px;max-height:calc(100vh - 320px);border-radius:4px;overflow:hidden;background:#080d1a;box-shadow:0 50px 80px -50px rgba(0,0,0,.9)}
/* a hairline only: one clean still, no vignette, no ambient blur */
[data-vbwork2] .vw2-viewer::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
[data-vbwork2] .vw2-main{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
/* portrait design frames sit whole on the flat ground; tall ones (shorts, emailers) are flanked by their neighbours at natural ratio, full strength */
[data-vbwork2] .vw2-viewer.vw2-contain .vw2-main{object-fit:contain}
[data-vbwork2] .vw2-side{display:none;position:absolute;top:9%;height:82%;width:auto;border-radius:3px}
[data-vbwork2] .vw2-side-l{right:66%}
[data-vbwork2] .vw2-side-r{left:66%}
[data-vbwork2] .vw2-viewer.vw2-tall .vw2-side{display:block}
[data-vbwork2] .vw2-viewer.vw2-blank img{opacity:0} /* project changed and its first frame is not decoded yet: cut to black, never a stale frame */
[data-vbwork2] .vw2-flash{position:absolute;top:0;right:0;bottom:0;left:0;background:#fff;opacity:0;pointer-events:none}
[data-vbwork2] .vw2-flash.vw2-go{animation:vw2-flash .22s linear}
@keyframes vw2-flash{0%{opacity:0}35%{opacity:.16}100%{opacity:0}}
[data-vbwork2] .vw2-cap{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:end;margin-top:22px}
[data-vbwork2] .vw2-cap-l{min-width:0}
[data-vbwork2] .vw2-cap-l.vw2-swap{animation:vw2-swap .3s cubic-bezier(.2,.7,.3,1)}
@keyframes vw2-swap{from{opacity:0;transform:translateY(8px)}}
[data-vbwork2] .vw2-cap-head{display:flex;align-items:baseline;gap:14px}
[data-vbwork2] .vw2-cap-num{flex:none;font:400 clamp(26px,2.6vw,40px)/1 'Instrument Serif',serif;font-style:italic;color:#b6f500}
[data-vbwork2] .vw2-cap-title{margin:0;min-width:0;font-family:'Space Grotesk',sans-serif;font-size:clamp(26px,2.6vw,40px);font-weight:600;line-height:1.08;letter-spacing:-.03em;color:#f6f9ff;overflow-wrap:break-word;text-wrap:balance}
[data-vbwork2] .vw2-cap-meta{margin:8px 0 0;font-size:14px;font-weight:400;line-height:1.4;color:#8da0c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} /* one line always: the caption's bottom edge must not move between projects */
/* plain text link: word, hairline underline, arrow that slides */
[data-vbwork2] .vw2-open{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;line-height:1;white-space:nowrap;color:#f6f9ff}
[data-vbwork2] .vw2-open-t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px;text-decoration-color:rgba(246,249,255,.35)}
[data-vbwork2] .vw2-open svg{flex:none;width:16px;height:16px;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
[data-vbwork2] .vw2-open:active svg{transform:translateX(4px)}

/* ---------- DESKTOP: list left, docked monitor right. JS uses this exact query string. ---------- */
@media (min-width: 1024px) and (min-height: 560px){
  [data-vbwork2] .vw2-sub-d{display:inline}
  [data-vbwork2] .vw2-sub-m{display:none}
  [data-vbwork2] .vw2-body{display:grid;grid-template-columns:minmax(0,44fr) minmax(0,56fr);column-gap:clamp(28px,4vw,64px);align-items:start}
  /* 96px clears the host header; taller screens centre the dock instead of leaving air under it. JS reads the computed top. */
  [data-vbwork2] .vw2-mon{display:block;position:sticky;top:clamp(96px,calc((100vh - 760px) / 2 + 48px),200px);align-self:start;margin-top:25px} /* 22px row padding + the thumb's 3px: frame top registers with the first contact print */
  /* register: numeral 30 > title 28 > count 14, one step each; the numeral leads the row */
  [data-vbwork2] .vw2-grid{grid-template-columns:48px 112px minmax(0,1fr) 30px;column-gap:18px;align-items:start;padding:24px 0}
  [data-vbwork2] .vw2-num{font-size:30px;padding-top:3px} /* sits on the title line, not mid-row */
  [data-vbwork2] .vw2-thumb{width:112px;height:70px;margin-top:3px}
  [data-vbwork2] .vw2-title{font-size:clamp(20px,1.9vw,28px)}
  [data-vbwork2] .vw2-meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  [data-vbwork2] .vw2-thumb img{transition:transform .6s cubic-bezier(.2,.7,.3,1)}
  [data-vbwork2] .vw2-strip{display:none}
  [data-vbwork2] .vw2-arrow{grid-column:4;align-self:center}
  /* the playhead is the one row at full strength; the rest sit back a touch (muted text lifted so it still clears 4.5:1) */
  [data-vbwork2] .vw2-item{opacity:.85}
  [data-vbwork2] .vw2-item:not(.vw2-on) .vw2-meta,[data-vbwork2] .vw2-item:not(.vw2-on) .vw2-num{color:#c9d5ee}
  [data-vbwork2] .vw2-item.vw2-on{opacity:1}
  [data-vbwork2] .vw2-item.vw2-on .vw2-num{color:#b6f500}
  [data-vbwork2] .vw2-item.vw2-on .vw2-thumb img{transform:scale(1.06)}
  [data-vbwork2] .vw2-item.vw2-on .vw2-arrow{opacity:1;transform:translateX(0)}
}
/* narrow + tall desktop: 26px titles can wrap here, so reserve two lines and the caption never changes height */
@media (min-width: 1024px) and (max-width: 1199px) and (min-height: 781px){
  [data-vbwork2] .vw2-cap-l{min-height:calc(2.16 * clamp(26px,2.6vw,40px) + 28px)}
}
/* short desktop (1366x650, 1440x900 minus browser chrome): spend the height on the picture, not the caption */
@media (min-width: 1024px) and (min-height: 560px) and (max-height: 780px){
  [data-vbwork2] .vw2-cap-title,[data-vbwork2] .vw2-cap-num{font-size:26px}
  [data-vbwork2] .vw2-viewer{max-height:calc(100vh - 260px)} /* 96 top + <=146 caption (2-line title) + 18 air */
}
@media (min-width: 1600px) and (min-height: 560px){
  [data-vbwork2] .vw2-body{grid-template-columns:minmax(0,40fr) minmax(0,60fr)}
}

/* ---------- entrance (JS adds .vw2-anim only when IntersectionObserver exists and motion is allowed) ---------- */
[data-vbwork2].vw2-anim .vw2-rv{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.7,.3,1),transform .8s cubic-bezier(.2,.7,.3,1)}
[data-vbwork2].vw2-anim .vw2-d1{transition-delay:.08s}
[data-vbwork2].vw2-anim .vw2-d2{transition-delay:.16s}
[data-vbwork2].vw2-anim .vw2-in .vw2-rv,[data-vbwork2].vw2-anim .vw2-rv.vw2-in{opacity:1;transform:none}
[data-vbwork2].vw2-anim .vw2-row{opacity:0;transform:translateY(24px);transition:transform .8s cubic-bezier(.2,.7,.3,1),opacity .7s cubic-bezier(.2,.7,.3,1)}
[data-vbwork2].vw2-anim .vw2-row.vw2-in{opacity:1;transform:none}
[data-vbwork2].vw2-anim .vw2-row.vw2-notrans{transition:none}
[data-vbwork2].vw2-anim .vw2-mon-in{opacity:0;transform:scale(.97);transition:opacity .9s cubic-bezier(.2,.7,.3,1) .12s,transform .9s cubic-bezier(.2,.7,.3,1) .12s}
[data-vbwork2].vw2-anim .vw2-mon-in.vw2-in{opacity:1;transform:none}
@media (min-width: 1024px) and (min-height: 560px){
  [data-vbwork2].vw2-anim .vw2-row{opacity:1;transform:translateY(105%)} /* masked slide-up only (no fade softening the mask edge): the li is the overflow:hidden line */
  [data-vbwork2].vw2-anim .vw2-row.vw2-in{transform:none}
}
@media (prefers-reduced-motion:reduce){
  [data-vbwork2] *,[data-vbwork2] *::before,[data-vbwork2] *::after{animation:none!important;transition:none!important}
}
</style>

<section data-vbwork2 id="work" data-sec="work" data-screen-label="Selected Work" aria-labelledby="vw2-h">
  <div class="vw2-wrap">
    <header class="vw2-head">
      <div class="vw2-head-top">
        <div>
          <span class="vw2-eyebrow vw2-rv">02 — The work</span>
          <h2 class="vw2-h2" id="vw2-h"><span data-lines="1">Everything I've made,<br>cut into one <span class="vw2-accent">sequence.</span></span></h2>
        </div>
        <div class="vw2-head-r">
          <p class="vw2-sub vw2-rv vw2-d1"><span class="vw2-sub-d">Scroll the list and the monitor cuts to each project. Open any one for the full set.</span><span class="vw2-sub-m">Open any project for the full set.</span></p>
          <dl class="vw2-stats vw2-rv vw2-d2">
            <div><dt>Projects</dt><dd data-vw2-n="projects"></dd></div>
            <div><dt>Design pieces</dt><dd data-vw2-n="pieces"></dd></div>
            <div><dt>Films</dt><dd data-vw2-n="films"></dd></div>
          </dl>
        </div>
      </div>
      <div class="vw2-bar vw2-rv">
        <div class="vw2-filters" role="group" aria-label="Filter projects">
          <button type="button" class="vw2-filt" data-f="all" aria-pressed="true"><span class="vw2-fl">All <b></b></span><span class="vw2-sr"> projects</span></button>

    <div class="vw2-body">

      <div class="vw2-mon">

          <!-- mouse-only click target: the one keyboard / screen-reader control is "Open project" below -->
          <button type="button" class="vw2-viewer" data-vw2="viewer" data-vw2-open data-cursor="Open" aria-hidden="true" tabindex="-1">
            <img class="vw2-side vw2-side-l" data-vw2="sidel" alt="">
            <img class="vw2-side vw2-side-r" data-vw2="sider" alt="">

            <span class="vw2-flash" data-vw2="flash"></span>
          </button>
          <div class="vw2-cap">
            <div class="vw2-cap-l" data-vw2="capl">
              <div class="vw2-cap-head"><span class="vw2-cap-num" data-vw2="num" aria-hidden="true"></span><h3 class="vw2-cap-title" data-vw2="title"></h3></div>
              <p class="vw2-cap-meta" data-vw2="meta"></p>
            </div>
            <button type="button" class="vw2-open" data-vw2="open" data-vw2-open data-cursor="Open"><span class="vw2-open-t">Open project</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ===== SECTION SCRIPT (paste) — strict ES5, one IIFE, reads scroll position only (passive listener + rAF), never scrolls the page ===== -->
<script>
(function () {
  'use strict';
  var root = document.querySelector('[data-vbwork2]');
  var WORK = window.VB_WORK;
  if (!root || !WORK || !WORK.length) { return; }

  var DESK = '(min-width: 1024px) and (min-height: 560px)';   // identical string in the CSS

  resolve();   // first row is loaded from the start: the monitor is never empty
  kick();
})();
</script>
